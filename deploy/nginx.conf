server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;

    # Приложение полностью локальное: внешних запросов нет, поэтому политика строгая.
    # Сжатие и HSTS добавляет Caddy.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Файлы в /assets/ имеют хеш в имени — кэшируем надолго.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Страница всегда проверяется заново, чтобы обновления доходили сразу.
    location = /index.html {
        expires -1;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
